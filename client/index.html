<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved theme BEFORE first paint so dark mode never flashes.
      try {
        if (localStorage.getItem('ascend_theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {
        /* storage unavailable (e.g. sandboxed preview) — stay in light mode */
      }
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>" />
    <title>Ascend — Rise one step at a time</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
